<!DOCTYPE html>
<!--
================================================================================
  MotionCapture Studio（单文件 Web 版） 使用说明
================================================================================
  1. 用 Chrome / Edge 打开此文件（双击即可，无需服务器，所有计算均在本地浏览器完成）。
  2. 点击「导入视频」上传一段有人体的视频（支持 MP4 / MOV / WEBM，≤5 分钟，建议 ≤200MB），
     也可将视频文件直接拖入左侧区域。
  3. 系统自动对视频第一帧做人形检测：检测到 1 人时自动锁定（绿色方框）；
     检测到多人时用青色方框标出，点击方框选择追踪目标。
  4. 点击「播放」，左侧视频播放，右侧模特实时同步运动并自动记录关键帧。
  5. 播放结束或点击「暂停/停止」后，记录自动无条件保存，视频自动弹出。
  6. 进入「工作室模式」：可回放记录（播放/暂停、进度拖拽、0.5x/1x/2x 变速）。
  7. 点击「创建自定义模特」进入身形设定，开放 37 个调节滑块（支持左右对称锁定），
     模特在保持记录动作的前提下实时变形 —— “新模特学会旧动作”。
  8. 「导入修正视频」可用第二段视频对记录做加权融合修正，可重复多次。
  9. 旋转到满意角度后，点击「导出 720P 视频」生成 1280×720@60fps 的 WebM 动作视频。
 10. 如需制作新记录，必须先「删除记录」（全局仅允许存在一条记录）。
================================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionCapture Studio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0f;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:#d8d8e0; }
  #app { display:flex; flex-direction:column; width:100%; height:100%; }

  /* ---------- 顶部栏 ---------- */
  #topbar { height:56px; flex:0 0 56px; display:flex; align-items:center;
    padding:0 16px; gap:12px; background:#101018; border-bottom:1px solid #22222e; }
  #appTitle { font-size:16px; font-weight:700; letter-spacing:1px; color:#00d4ff; white-space:nowrap; }
  #statusText { flex:1; text-align:center; font-size:13px; color:#9a9ab0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #topbarBtns { display:flex; align-items:center; gap:8px; }
  .btn { background:#1c1c28; color:#d8d8e0; border:1px solid #2c2c3c; border-radius:8px;
    padding:7px 14px; font-size:13px; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:#00d4ff; color:#00d4ff; background:#16202a; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.primary { background:#0a2a33; border-color:#00d4ff; color:#00d4ff; }
  .btn.danger { background:#2a1216; border-color:#ff4d5e; color:#ff6b78; }
  .btn.danger:hover:not(:disabled) { background:#3a161c; border-color:#ff4d5e; color:#ff8590; }
  .btn.hidden, .hidden { display:none !important; }
  /* 性别切换 */
  #genderSwitch { display:flex; border:1px solid #2c2c3c; border-radius:8px; overflow:hidden; }
  #genderSwitch button { background:#1c1c28; border:none; color:#9a9ab0; padding:7px 12px;
    font-size:13px; cursor:pointer; transition:all .15s; }
  #genderSwitch button.active { background:#0a2a33; color:#00d4ff; }
  #genderSwitch button:disabled { opacity:.35; cursor:not-allowed; }
  #genderSwitch.disabled { opacity:.45; pointer-events:none; }

  /* ---------- 主体区域 ---------- */
  #main { flex:1; display:flex; min-height:0; }
  #leftPane { width:50%; height:100%; background:#0a0a0f; border-right:1px solid #22222e;
    position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #rightPane { width:50%; height:100%; background:#1a1a20; position:relative; overflow:hidden; }

  /* 左侧：空占位 / 拖拽区 */
  #dropZone { width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; cursor:pointer; border:2px dashed transparent; transition:border-color .2s; }
  #dropZone.dragover { border-color:#00d4ff; background:#0c1418; }
  #dropZone .icon { font-size:52px; opacity:.5; }
  #dropZone .tip { font-size:14px; color:#9a9ab0; }
  #dropZone .sub { font-size:12px; color:#55556a; }

  /* 左侧：视频容器 */
  #videoWrap { position:relative; width:100%; height:100%; display:flex;
    align-items:center; justify-content:center; background:#000; }
  #videoEl { max-width:100%; max-height:100%; display:block; }
  #overlayCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:auto; }

  /* 左侧：记录信息面板 */
  #recordPanel { display:none; width:100%; height:100%; padding:28px; overflow-y:auto; }
  #recordPanel h2 { font-size:16px; color:#00d4ff; margin-bottom:16px; }
  .infoGrid { display:grid; grid-template-columns:auto 1fr; gap:8px 18px; font-size:13px;
    background:#12121c; border:1px solid #22222e; border-radius:10px; padding:16px; margin-bottom:18px; }
  .infoGrid .k { color:#7777aa; }
  .infoGrid .v { color:#e8e8f0; }
  .panelBtns { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  /* 回放控制 */
  #replayControls { background:#12121c; border:1px solid #22222e; border-radius:10px; padding:14px 16px; }
  #replayControls .row1 { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #replayProgress { flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:#262636; outline:none; cursor:pointer; }
  #replayProgress::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px;
    border-radius:50%; background:#00d4ff; cursor:pointer; }
  #replayTime { font-size:12px; color:#9a9ab0; min-width:86px; text-align:right; font-variant-numeric:tabular-nums; }
  .speedBtn { background:#1c1c28; border:1px solid #2c2c3c; color:#9a9ab0; border-radius:6px;
    padding:4px 10px; font-size:12px; cursor:pointer; }
  .speedBtn.active { color:#00d4ff; border-color:#00d4ff; background:#0a2a33; }

  /* 右侧：Three.js 画布 */
  #threeContainer { position:absolute; inset:0; }
  #threeContainer canvas { display:block; }

  /* 模特身形设定面板（右侧视口左边缘） */
  #bodyPanel { position:absolute; left:0; top:0; bottom:0; width:280px; background:rgba(16,16,24,.96);
    border-right:1px solid #22222e; display:flex; flex-direction:column; z-index:10;
    transition:transform .25s; }
  #bodyPanel.collapsed { transform:translateX(-232px); }
  #bodyPanel.collapsed #bodyPanelBody,
  #bodyPanel.collapsed #bodyPanelHeader .title,
  #bodyPanel.collapsed #subStateTag { visibility:hidden; }
  #bodyPanelHeader { height:48px; flex:0 0 48px; display:flex; align-items:center; padding:0 12px;
    gap:8px; cursor:pointer; border-bottom:1px solid #22222e; user-select:none; }
  #bodyPanelHeader .title { font-size:13px; font-weight:600; color:#00d4ff; flex:1; }
  #subStateTag { font-size:11px; color:#0a0a0f; background:#00d4ff; border-radius:4px; padding:2px 6px; }
  #collapseIcon { color:#7777aa; font-size:12px; }
  #bodyPanelBody { flex:1; overflow-y:auto; padding:10px 12px 20px; }
  #bodyPanelBody::-webkit-scrollbar { width:6px; }
  #bodyPanelBody::-webkit-scrollbar-thumb { background:#2c2c3c; border-radius:3px; }
  .panelNote { font-size:12px; color:#7777aa; line-height:1.6; padding:8px 2px; }
  .panelRow { display:flex; gap:8px; margin:10px 0; }
  .panelRow .btn { flex:1; text-align:center; padding:6px 4px; font-size:12px; }
  .symRow { display:flex; align-items:center; gap:8px; font-size:12px; color:#9a9ab0; margin:10px 0; }
  .symRow input { accent-color:#00d4ff; }
  details.paramGroup { border:1px solid #22222e; border-radius:8px; margin-bottom:8px; background:#12121c; }
  details.paramGroup summary { cursor:pointer; padding:8px 10px; font-size:12px; color:#00d4ff;
    font-weight:600; user-select:none; list-style:none; }
  details.paramGroup summary::before { content:"▾ "; }
  details.paramGroup:not([open]) summary::before { content:"▸ "; }
  details.paramGroup .groupBody { padding:4px 10px 10px; }
  .sliderRow { display:flex; align-items:center; gap:6px; margin:7px 0; font-size:12px; }
  .sliderRow .lbl { width:76px; flex:0 0 76px; color:#b8b8cc; }
  .sliderRow input[type=range] { flex:1; min-width:0; -webkit-appearance:none; appearance:none; height:4px;
    border-radius:2px; background:#262636; outline:none; }
  .sliderRow input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
    width:12px; height:12px; border-radius:50%; background:#00d4ff; cursor:pointer; }
  .sliderRow .val { width:34px; flex:0 0 34px; text-align:right; color:#00d4ff;
    font-variant-numeric:tabular-nums; font-size:11px; }
  .sliderRow.disabled { opacity:.35; pointer-events:none; }
  details.paramGroup.rightLocked .groupBody { opacity:.35; pointer-events:none; }
  details.paramGroup.rightLocked summary::after { content:"（已对称锁定）"; color:#55556a; font-weight:400; }

  /* ---------- 模态框 / 提示 ---------- */
  #modalMask { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:100; }
  #modalBox { background:#14141e; border:1px solid #2c2c3c; border-radius:12px; padding:22px 24px;
    width:380px; max-width:90vw; }
  #modalBox h3 { font-size:15px; color:#e8e8f0; margin-bottom:12px; }
  #modalBox .modalText { font-size:13px; color:#9a9ab0; line-height:1.6; margin-bottom:18px; }
  #modalBox .modalBtns { display:flex; justify-content:flex-end; gap:10px; }
  /* 融合面板 */
  #fusionSliders { margin-bottom:18px; }
  #fusionSliders .sliderRow .lbl { width:96px; flex-basis:96px; }
  /* Toast */
  #toast { position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
    background:#1c1c28; border:1px solid #00d4ff; color:#d8f6ff; padding:10px 20px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .3s; z-index:200; max-width:80vw; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.warn { border-color:#ffb347; color:#ffe8cc; }
  #toast.error { border-color:#ff4d5e; color:#ffd6da; }

  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="app">
  <!-- ============ 顶部栏 ============ -->
  <div id="topbar">
    <div id="appTitle">MotionCapture Studio</div>
    <div id="statusText">等待导入视频</div>
    <div id="topbarBtns">
      <div id="genderSwitch">
        <button id="btnMale" class="active">男模</button>
        <button id="btnFemale">女模</button>
      </div>
      <button class="btn primary" id="btnImport">导入视频</button>
      <button class="btn" id="btnPlay" disabled>播放</button>
      <button class="btn hidden" id="btnDeleteVideo">删除视频</button>
      <button class="btn hidden" id="btnCancelCorrect">取消修正</button>
      <button class="btn hidden" id="btnCorrection">导入修正视频</button>
      <button class="btn hidden" id="btnCustom">创建自定义模特</button>
      <button class="btn hidden" id="btnExport">导出 720P 视频</button>
      <button class="btn danger hidden" id="btnDeleteRecord">删除记录</button>
    </div>
  </div>

  <!-- ============ 主体 ============ -->
  <div id="main">
    <!-- 左侧：视频 / 记录信息区 -->
    <div id="leftPane">
      <div id="dropZone">
        <div class="icon">🎬</div>
        <div class="tip">请导入视频（支持 MP4/MOV/WEBM，≤5 分钟）</div>
        <div class="sub">点击此处或拖拽文件到此处上传 · 也可加载已有记录 JSON</div>
        <button class="btn" id="btnLoadRecord">加载记录 JSON</button>
      </div>
      <div id="videoWrap" class="hidden">
        <video id="videoEl" playsinline></video>
        <canvas id="overlayCanvas"></canvas>
      </div>
      <div id="recordPanel">
        <h2>记录信息面板</h2>
        <div class="infoGrid">
          <span class="k">记录时长</span><span class="v" id="infoDuration">-</span>
          <span class="k">总帧数</span><span class="v" id="infoFrames">-</span>
          <span class="k">创建时间</span><span class="v" id="infoCreated">-</span>
          <span class="k">原始性别</span><span class="v" id="infoGender">-</span>
        </div>
        <div class="panelBtns">
          <button class="btn primary" id="btnReplay">回放</button>
          <button class="btn" id="btnCorrection2">导入修正视频</button>
          <button class="btn" id="btnExportRecord">导出记录 JSON</button>
          <button class="btn danger" id="btnDeleteRecord2">删除记录</button>
        </div>
        <div id="replayControls">
          <div class="row1">
            <button class="btn" id="btnReplayPlay" style="min-width:74px;">播放</button>
            <input type="range" id="replayProgress" min="0" max="1000" value="0">
            <span id="replayTime">0.00 / 0.00s</span>
          </div>
          <div class="row1" style="margin-bottom:0;">
            <span style="font-size:12px;color:#7777aa;">速度</span>
            <button class="speedBtn" data-speed="0.5">0.5x</button>
            <button class="speedBtn active" data-speed="1">1x</button>
            <button class="speedBtn" data-speed="2">2x</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：Three.js 视口 -->
    <div id="rightPane">
      <div id="threeContainer"></div>
      <div id="bodyPanel" class="collapsed hidden">
        <div id="bodyPanelHeader">
          <span class="title">模特身形设定</span>
          <span id="subStateTag">原始</span>
          <span id="collapseIcon">▶</span>
        </div>
        <div id="bodyPanelBody">
          <div class="panelNote" id="panelNote"></div>
          <div class="panelRow">
            <button class="btn" id="btnCustom2">创建自定义模特</button>
          </div>
          <div id="customControls" class="hidden">
            <div class="symRow">
              <label><input type="checkbox" id="symLock" checked> 左右对称锁定</label>
            </div>
            <div id="sliderGroups"></div>
            <div class="panelRow">
              <button class="btn" id="btnResetParams">重置为默认</button>
            </div>
            <div class="panelRow">
              <button class="btn" id="btnSaveConfig">保存模特配置</button>
              <button class="btn" id="btnLoadConfig">加载模特配置</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 模态框（确认删除 / 融合设置 / 导出提示） -->
<div id="modalMask">
  <div id="modalBox">
    <h3 id="modalTitle">提示</h3>
    <div class="modalText" id="modalText"></div>
    <div id="fusionSliders" class="hidden">
      <div class="sliderRow">
        <span class="lbl">原记录权重</span>
        <input type="range" id="weightA" min="0" max="1" step="0.01" value="0.5">
        <span class="val" id="weightAVal">0.50</span>
      </div>
      <div class="sliderRow">
        <span class="lbl">新记录权重</span>
        <input type="range" id="weightB" min="0" max="1" step="0.01" value="0.5">
        <span class="val" id="weightBVal">0.50</span>
      </div>
    </div>
    <div class="modalBtns">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,video/*">
<input type="file" id="recordFileInput" accept=".json,application/json">
<input type="file" id="configFileInput" accept=".json,application/json">

<!-- CDN：Three.js r128 + OrbitControls + 旧版 MediaPipe Pose（降级兜底）。
     主引擎 Tasks Vision PoseLandmarker 通过动态 import() 加载 ESM 版本（见 initPose）。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script>
"use strict";

/* ================================================================
   1. 配置区
================================================================ */
// 37 项身形参数：头部 5 + 躯干 8 + 左臂 6 + 右臂 6 + 左腿 6 + 右腿 6
const PARAM_RANGES = { min: 0.5, max: 1.5, step: 0.01 };
const WIDTH_RANGE  = { min: 0.5, max: 1.8, step: 0.01 }; // 肩宽 / 髋宽

const GENDER_DEFAULTS = {
  male: {
    neckLen:1.0,  neckThick:1.0,  headLen:1.05, headWid:1.0,  headDep:1.0,
    shoulderWid:1.2, chestLen:1.0, chestTop:1.1, chestBot:1.0,
    waistLen:1.0,  waistTop:0.9,  waistBot:0.95, hipWid:0.95,
    uArmLenL:1.0, uArmThkL:1.05, lArmLenL:1.0, lArmThkL:1.0, handLenL:1.0, handThkL:1.0,
    uArmLenR:1.0, uArmThkR:1.05, lArmLenR:1.0, lArmThkR:1.0, handLenR:1.0, handThkR:1.0,
    thighLenL:1.0, thighThkL:1.05, shinLenL:1.0, shinThkL:1.0, footLenL:1.0, footThkL:1.0,
    thighLenR:1.0, thighThkR:1.05, shinLenR:1.0, shinThkR:1.0, footLenR:1.0, footThkR:1.0
  },
  female: {
    neckLen:0.9,  neckThick:0.85, headLen:1.0,  headWid:0.95, headDep:0.9,
    shoulderWid:0.9, chestLen:0.95, chestTop:1.0, chestBot:0.95,
    waistLen:1.0,  waistTop:0.75, waistBot:1.05, hipWid:1.1,
    uArmLenL:1.0, uArmThkL:0.9, lArmLenL:1.0, lArmThkL:0.85, handLenL:1.0, handThkL:0.9,
    uArmLenR:1.0, uArmThkR:0.9, lArmLenR:1.0, lArmThkR:0.85, handLenR:1.0, handThkR:0.9,
    thighLenL:1.0, thighThkL:1.0, shinLenL:0.95, shinThkL:0.9, footLenL:1.0, footThkL:0.9,
    thighLenR:1.0, thighThkR:1.0, shinLenR:0.95, shinThkR:0.9, footLenR:1.0, footThkR:0.9
  }
};

// 滑块分组定义（label, key, 是否为宽度范围, 右侧镜像标记）
const PARAM_GROUPS = [
  { title:'头部', items:[
    ['颈部长度','neckLen'],['颈部粗细','neckThick'],['头部长度','headLen'],
    ['头部宽度','headWid'],['头部厚度','headDep']]},
  { title:'躯干', items:[
    ['肩宽','shoulderWid','W'],['胸廓长度','chestLen'],['胸廓上端粗细','chestTop'],
    ['胸廓下端粗细','chestBot'],['腰腹长度','waistLen'],['腰腹上端粗细','waistTop'],
    ['腰腹下端粗细','waistBot'],['髋宽','hipWid','W']]},
  { title:'左臂', items:[
    ['上臂长度','uArmLenL'],['上臂粗细','uArmThkL'],['前臂长度','lArmLenL'],
    ['前臂粗细','lArmThkL'],['手部长度','handLenL'],['手部粗细','handThkL']]},
  { title:'右臂', side:'R', items:[
    ['上臂长度','uArmLenR'],['上臂粗细','uArmThkR'],['前臂长度','lArmLenR'],
    ['前臂粗细','lArmThkR'],['手部长度','handLenR'],['手部粗细','handThkR']]},
  { title:'左腿', items:[
    ['大腿长度','thighLenL'],['大腿粗细','thighThkL'],['小腿长度','shinLenL'],
    ['小腿粗细','shinThkL'],['脚部长度','footLenL'],['脚部粗细','footThkL']]},
  { title:'右腿', side:'R', items:[
    ['大腿长度','thighLenR'],['大腿粗细','thighThkR'],['小腿长度','shinLenR'],
    ['小腿粗细','shinThkR'],['脚部长度','footLenR'],['脚部粗细','footThkR']]}
];

// 模特基础尺寸（米级，配合参数缩放）
const BASE = {
  shoulderDist: 0.38, hipDist: 0.17,
  chestLen: 0.30, chestR: 0.130,
  waistLen: 0.22, waistR: 0.115,
  neckLen: 0.07, neckR: 0.040,
  headSX: 0.082, headSY: 0.105, headSZ: 0.088,
  uArmLen: 0.22, uArmR: 0.040,
  lArmLen: 0.20, lArmR: 0.034,
  handLen: 0.12, handR: 0.030,

const bodyMaterial  = new THREE.MeshStandardMaterial({ color:COLOR_BODY,  roughness:0.12, metalness:0.08 });
const jointMaterial = new THREE.MeshStandardMaterial({ color:COLOR_JOINT, roughness:0.25, metalness:0.1 });

// CapsuleGeometry 兼容实现（r128 无内置 CapsuleGeometry 时用 Lathe 生成胶囊体）
function createCapsuleGeometry(radius, length) {
  if (THREE.CapsuleGeometry) return new THREE.CapsuleGeometry(radius, length, 4, 8);
  const pts = [];
  const half = length / 2, SEG = 6;
  for (let i = 0; i <= SEG; i++) {           // 下半球
    const t = (i / SEG) * Math.PI / 2;
    pts.push(new THREE.Vector2(Math.max(radius * Math.sin(t), 1e-4), -half - radius * Math.cos(t)));
  }
  pts.push(new THREE.Vector2(radius, half)); // 圆柱段
  for (let i = 0; i <= SEG; i++) {           // 上半球
    const t = (i / SEG) * Math.PI / 2;
    pts.push(new THREE.Vector2(Math.max(radius * Math.cos(t), 1e-4), half + radius * Math.sin(t)));
  }
  return new THREE.LatheGeometry(pts, 12);
}

// 全局模型引用表
const model = {};       // 各 Group / Mesh 引用
const targetQ = {};     // 各骨骼目标四元数（用于 SLERP 平滑）

function makeJointSphere(r) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16), jointMaterial);
  return s;
}
// 创建一段肢体：Group(关节球 + 胶囊 Mesh)，胶囊沿局部 -Y 延伸
function makeLimbSeg(name, len, radius) {
  const g = new THREE.Group();
  g.name = name;
  g.add(makeJointSphere(radius * 1.18));
  const mesh = new THREE.Mesh(createCapsuleGeometry(radius, len), bodyMaterial);
  mesh.name = name + '_Mesh';
  g.add(mesh);
  g.userData.baseLen = len;
  g.userData.baseR = radius;
  g.userData.total = len + radius * 2;
  g.userData.mesh = mesh;
  return g;
}

  // NeckGroup / HeadGroup
  const neck = makeLimbSeg('NeckGroup', BASE.neckLen, BASE.neckR);

  model.neck = neck; model.neckMesh = neck.userData.mesh;
  const headGroup = new THREE.Group();
  headGroup.name = 'HeadGroup';
  neck.add(headGroup);
  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), bodyMaterial);
  headMesh.name = 'HeadMesh';
  headGroup.add(headMesh);
  model.headGroup = headGroup; model.headMesh = headMesh;

  // 手臂（左/右）
  ['L', 'R'].forEach(side => {
    const sideName = side === 'L' ? 'Left' : 'Right';

    lArm.add(wrist);

    wrist.add(hand);
    model['shoulder' + side] = shoulder;
    model['uArm' + side] = uArm; model['uArmMesh' + side] = uArm.userData.mesh;
    model['elbow' + side] = elbow;
    model['lArm' + side] = lArm; model['lArmMesh' + side] = lArm.userData.mesh;
    model['wrist' + side] = wrist;
    model['hand' + side] = hand; model['handMesh' + side] = hand.userData.mesh;
  });

  // 腿（左/右）
  ['L', 'R'].forEach(side => {
    const sideName = side === 'L' ? 'Left' : 'Right';
    const hip = new THREE.Group();
    hip.name = sideName + 'HipJoint';
    hip.add(makeJointSphere(BASE.jointR * 1.1));

  ['spineLower','spineUpper','neck','headGroup',
   'shoulderL','shoulderR','uArmL','uArmR','elbowL','elbowR','lArmL','lArmR','wristL','wristR','handL','handR',
   'hipL','hipR','thighL','thighR','kneeL','kneeR','shinL','shinR','ankleL','ankleR','footL','footR'

// 更新一段肢体：scale + mesh 位置 + 子关节位置（保持当前旋转姿态不变）
function updateLimb(segGroup, mesh, lenParam, thkParam, childJoints) {
  const total = segGroup.userData.total * lenParam;
  mesh.scale.set(thkParam, lenParam, thkParam);
  mesh.position.y = -total / 2;                 // 肢体从关节处向下延伸
  (childJoints || []).forEach(j => { j.position.set(0, -total, 0); }); // 子关节随肢体变长自动位移
  return total;
}
// 躯干曲面：车削轮廓（两端圆角收边 + 中部微鼓），替代生硬直筒
function torsoGeometry(topR, bottomR, h) {
  const pts = [], N = 14;
  for (let i = 0; i <= N; i++) {
    const t = i / N, y = (t - 0.5) * h;
    let r = bottomR + (topR - bottomR) * t;
    const edge = Math.min(t / 0.16, 1) * Math.min((1 - t) / 0.16, 1); // 端部收圆
    r *= 0.42 + 0.58 * Math.sin(edge * Math.PI / 2);
    r *= 1 + 0.05 * Math.sin(t * Math.PI);                            // 中段微鼓
    pts.push(new THREE.Vector2(Math.max(r, 0.012), y));
  }
  return new THREE.LatheGeometry(pts, 20);
}
// 更新躯干段（支持锥度，重建几何体并 dispose 旧几何体）
function updateTorso(mesh, topR, bottomR, height) {
  const old = mesh.geometry;
  mesh.geometry = torsoGeometry(topR, bottomR, Math.max(height, 0.04));
  old.dispose();
  mesh.position.y = height / 2;
  return height;
}
// 骨盆段（髋线下方，圆润过渡到大腿根）
function updatePelvis(mesh, p) {
  const old = mesh.geometry;
  mesh.geometry = torsoGeometry(BASE.waistR * p.waistBot * 1.06, BASE.hipDist * p.hipWid * 0.72 + 0.055, 0.15);
  old.dispose();
  mesh.position.y = -0.045;
}

// 核心：根据 37 项参数更新所有几何体、scale、子关节位置（不重建场景图）
function applyBodyParams(p) {
  // --- 腰腹 ---
  const waistH = updateTorso(model.waistMesh,
    BASE.waistR * p.waistTop, BASE.waistR * p.waistBot, BASE.waistLen * p.waistLen);
  model.spineUpper.position.set(0, waistH, 0);
  // --- 胸廓 ---
  const chestH = updateTorso(model.chestMesh,
    BASE.chestR * p.chestTop, BASE.chestR * p.chestBot, BASE.chestLen * p.chestLen);
  model.neck.position.set(0, chestH, 0);
  // --- 肩宽（移动肩关节 Group 的 position.x）---
  model.shoulderL.position.set(-BASE.shoulderDist * p.shoulderWid / 2, chestH * 0.88, 0);
  model.shoulderR.position.set( BASE.shoulderDist * p.shoulderWid / 2, chestH * 0.88, 0);
  // --- 髋宽 ---
  model.hipL.position.set(-BASE.hipDist * p.hipWid / 2, 0, 0);
  model.hipR.position.set( BASE.hipDist * p.hipWid / 2, 0, 0);
  // --- 颈部 / 头部 ---
  const neckTotal = updateLimb(model.neck, model.neckMesh, p.neckLen, p.neckThick, [model.headGroup]);
  model.headMesh.scale.set(BASE.headSX * p.headWid, BASE.headSY * p.headLen, BASE.headSZ * p.headDep);
  model.headMesh.position.y = BASE.headSY * p.headLen * 0.85;
  // --- 骨盆 ---
  updatePelvis(model.pelvisMesh, p);
  // --- 手臂 ---
  ['L', 'R'].forEach(s => {
    updateLimb(model['uArm' + s], model['uArmMesh' + s], p['uArmLen' + s], p['uArmThk' + s], [model['elbow' + s]]);
    updateLimb(model['lArm' + s], model['lArmMesh' + s], p['lArmLen' + s], p['lArmThk' + s], [model['wrist' + s]]);
    updateLimb(model['hand' + s], model['handMesh' + s], p['handLen' + s], p['handThk' + s], []);
    model['handMesh' + s].scale.z *= 0.55; // 手掌前后压扁，更接近手型
  });
  // --- 腿 ---
  let thighTotal = 0, shinTotal = 0;
  ['L', 'R'].forEach(s => {
    const t = updateLimb(model['thigh' + s], model['thighMesh' + s], p['thighLen' + s], p['thighThk' + s], [model['knee' + s]]);
    const sh = updateLimb(model['shin' + s], model['shinMesh' + s], p['shinLen' + s], p['shinThk' + s], [model['ankle' + s]]);
    const fm = model['footMesh' + s];
    const footTotal = model['foot' + s].userData.total * p['footLen' + s];
    fm.scale.set(p['footThk' + s] * 1.08, p['footLen' + s], p['footThk' + s] * 0.6); // 脚型：略宽、上下压扁
    fm.rotation.x = Math.PI / 2;              // 脚部沿 +Z 向前延伸
    fm.position.set(0, -BASE.ankleH * 0.35, footTotal / 2);
    thighTotal = t; shinTotal = sh;
  });
  // 根节点高度：大腿 + 小腿 + 脚踝高度，确保站立时脚底触地
  curLegHeight = thighTotal + shinTotal + BASE.ankleH * Math.max(p.footThkL, 0.5);
}

/* ================================================================
   5. 姿态映射（关键点 → 骨骼旋转，向量法，与肢体长度无关）
================================================================ */
const DOWN = new THREE.Vector3(0, -1, 0), UP = new THREE.Vector3(0, 1, 0), FWD = new THREE.Vector3(0, 0, 1);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q1 = new THREE.Quaternion();
let scaleSmooth = 2.0; // 标定点 → 模型空间的全局缩放（平滑更新）

// T-Pose：全部恢复默认站姿（双臂平举）。
// 子关节目标置为单位四元数（表示“延续父段方向”），前臂/手/小腿/脚自动打直。
function setTPoseTargets() {
  Object.keys(targetQ).forEach(k => targetQ[k].identity());
  targetQ.uArmL.setFromUnitVectors(DOWN, _v1.set(-1, 0, 0));
  targetQ.uArmR.setFromUnitVectors(DOWN, _v1.set(1, 0, 0));
  rootTarget.set(0, curLegHeight, 0);
}

// 层级补偿求解：给定骨骼期望的世界方向，结合父骨骼的世界目标旋转，解算局部四元数。
// qWorld = setFromUnitVectors(def, dirWorld)；qLocal = inv(qParentWorld) * qWorld。
// 这样无论躯干如何倾斜，四肢的绝对方向都由关键点精确决定，且与肢体长度无关。
const _dir = new THREE.Quaternion();
function worldQOf(defVec, dirVec) {
  return new THREE.Quaternion().setFromUnitVectors(defVec, dirVec.clone().normalize());
}
function solveLocal(parentWorldQ, childWorldQ, targetKey) {
  targetQ[targetKey].copy(parentWorldQ).invert().multiply(childWorldQ);
}

// 主映射函数：landmarks 为 MediaPipe 33 点（含 visibility）。
// 热路径零分配：所有向量/四元数复用预分配缓冲，避免 60fps 下的 GC 抖动。
const _P = Array.from({ length:33 }, () => new THREE.Vector3()); // 变换后的 33 点
const _shC = new THREE.Vector3(), _nd = new THREE.Vector3();
const _W = Array.from({ length:15 }, () => new THREE.Quaternion()); // 各骨骼世界四元数
function wqInto(def, dx, dy, dz, out) {
  const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (len < 1e-6) return false; // 退化向量，保持上一帧目标
  _nd.set(dx / len, dy / len, dz / len);
  out.setFromUnitVectors(def, _nd);
  return true;
}
function updatePoseFromLandmarks(lm) {
  if (!lm || lm.length < 33) return;
  const gv = i => (lm[i].visibility === undefined ? 1 : lm[i].visibility);
  if ((gv(11) + gv(12) + gv(23) + gv(24)) / 4 < 0.4) return; // 关键点不可见，保持上一姿态

  // 坐标系转换：以髋部中心为原点，镜像 x / 翻转 y / 深度阻尼
  const hx = (lm[23].x + lm[24].x) / 2, hy = (lm[23].y + lm[24].y) / 2, hz = (lm[23].z + lm[24].z) / 2;
  for (let i = 0; i < 33; i++) {
    _P[i].set(-(lm[i].x - hx), -(lm[i].y - hy), -(lm[i].z - hz) * 0.6);
  }
  const pLSh = _P[11], pRSh = _P[12], pLHip = _P[23], pRHip = _P[24];
  _shC.addVectors(pLSh, pRSh).multiplyScalar(0.5);

  // 以肩宽为参考的相对空间缩放（自适应人物在画面中的远近）
  const lmShoulderW = Math.max(pLSh.distanceTo(pRSh), 1e-4);
  const s = BASE.shoulderDist * activeParams().shoulderWid / lmShoulderW;
  scaleSmooth += (s - scaleSmooth) * 0.15;

  // --- 躯干（脊柱方向：髋中心 → 肩中心；上脊柱局部为单位阵，避免双重弯曲）---
  let spineOk = wqInto(UP, _shC.x, _shC.y, _shC.z, _W[0]);
  if (spineOk) {
    targetQ.spineLower.copy(_W[0]);
    targetQ.spineUpper.identity();
    // --- 颈 / 头（肩中心 → 鼻尖）---
    if (wqInto(UP, _P[0].x - _shC.x, _P[0].y - _shC.y, _P[0].z - _shC.z, _W[2]))
      solveLocal(_W[0], _W[2], 'neck');
  }
  // --- 手臂（父链：胸廓 → 肩 → 上臂 → 前臂 → 手）---
  if (wqInto(DOWN, _P[13].x - pLSh.x, _P[13].y - pLSh.y, _P[13].z - pLSh.z, _W[3]) && spineOk)
    solveLocal(_W[0], _W[3], 'uArmL');

================================================================ */
function sampleFrames(frames, t, out) {
  if (!frames || frames.length === 0) return null;
  if (t <= frames[0].time) return frames[0].landmarks;
  const last = frames[frames.length - 1];
  if (t >= last.time) return last.landmarks; // 超过最新帧则使用最新可用帧
  let lo = 0, hi = frames.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (frames[mid].time <= t) lo = mid; else hi = mid; }
  const a = frames[lo], b = frames[hi];
  const span = Math.max(b.time - a.time, 1e-6);
  const k = Math.min(Math.max((t - a.time) / span, 0), 1);
  // 复用输出缓冲，避免渲染热循环中的内存分配（防 GC 卡顿）
  for (let i = 0; i < 33; i++) {

    O.x = A.x + (B.x - A.x) * k;

    O.z = A.z + (B.z - A.z) * k;
    O.visibility = Math.min(A.visibility !== undefined ? A.visibility : 1, B.visibility !== undefined ? B.visibility : 1);

  setStatus('正在加载检测引擎（首次需下载约 30MB 模型）…');

  while (!poseReady && performance.now() - t0 < 120000) await sleep(500);

    setStatus('检测引擎加载失败，请检查网络后刷新页面');

  poseLoop();

// 录制追踪循环：异步逐帧推理（目标约 30fps），多人结果由 handleTrackingFrame 匹配
async function poseLoop() {
  while (currentState === 'RECORDING') {
    if (videoEl.paused || videoEl.ended || !poseReady || videoEl.readyState < 2) { await sleep(60); continue; }
    const t0 = performance.now();
    const poses = await detectWithTimeout(captureFrame(640), 5000);
    if (currentState !== 'RECORDING') break;
    if (poses) handleTrackingFrame(poses);
    const elapsed = performance.now() - t0;
    if (elapsed < 30) await sleep(30 - elapsed);
  }
}

}

// 时间戳对齐 + 加权平均
function alignAndMerge(recA, recB, w1) {
  const w2 = 1 - w1;
  const dur = Math.max(recA.duration_seconds, recB.duration_seconds);
  const step = 1 / 30;
  const frames = [];
  for (let t = 0; t <= dur + 1e-6; t += step) {
    const la = sampleFrames(recA.frames, t, _fusA), lb = sampleFrames(recB.frames, t, _fusB);
    if (!la && !lb) continue;
    const A = la || lb, B = lb || la;
    const lms = new Array(33);
    for (let i = 0; i < 33; i++) {
      lms[i] = {
        x: round4(A[i].x * w1 + B[i].x * w2),
        y: round4(A[i].y * w1 + B[i].y * w2),
        z: round4(A[i].z * w1 + B[i].z * w2),
        visibility: round4(Math.min(A[i].visibility !== undefined ? A[i].visibility : 1,
                                    B[i].visibility !== undefined ? B[i].visibility : 1))
      };
    }
    frames.push({ time: Math.round(t * 1000) / 1000, landmarks: lms });
  }
  return {
    version: 2,
    created_at: new Date().toISOString(),
    gender: recA.gender,
    duration_seconds: Math.round(dur * 1000) / 1000,
    fps: 30,
    frames: frames
  };
}

/* ================================================================
   16. 动画循环（独立 60fps，与 MediaPipe 检测解耦）
================================================================ */
let lastFrameTs = performance.now();
let frameCount = 0;
function renderLoop() {
  requestAnimationFrame(renderLoop);
  const now = performance.now();
  const dt = Math.min((now - lastFrameTs) / 1000, 0.1);
  lastFrameTs = now;
  frameCount++;

  // 回放时间推进
  if (replay.playing && savedRecord) {
    replay.time += dt * replay.speed;
    let ended = false;
    if (replay.time >= savedRecord.duration_seconds) {
      replay.time = savedRecord.duration_seconds;
      replay.playing = false;
      ended = true;
      $('btnReplayPlay').textContent = '播放';
      if (exportActive && mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }
    if (ended || frameCount % 5 === 0) syncReplayUI(); // UI 节流，避免每帧 DOM 写入
  }

  // 根据状态决定姿态数据源（复用主采样缓冲）
  if (currentState === 'RECORDING' && frameBuffer.length > 0) {
    const lm = sampleFrames(frameBuffer, videoEl.currentTime, _sampleMain);
    if (lm) updatePoseFromLandmarks(lm);
    else if (lastValidLandmarks) updatePoseFromLandmarks(lastValidLandmarks);
  } else if (currentState === 'RECORD_SAVED' && savedRecord) {
    const lm = sampleFrames(savedRecord.frames, replay.time, _sampleMain);
    if (lm) updatePoseFromLandmarks(lm);
  }
  // EMPTY / VIDEO_LOADED：目标为 T-Pose（setTPoseTargets 已设定）

  // SLERP 平滑（因子 0.3）消除抖动
  Object.keys(targetQ).forEach(k => {
    if (model[k]) model[k].quaternion.slerp(targetQ[k], 0.3);
  });
  model.root.position.lerp(rootTarget, 0.3);

  // 接触阴影跟随模特（离地越高越淡）
  blobShadow.position.x = model.root.position.x;
  blobShadow.position.z = model.root.position.z;
  const lift = Math.max(0, model.root.position.y - curLegHeight);
  blobShadow.material.opacity = Math.max(0.2, 0.9 - lift * 1.1);

  controls.update();
  renderer.render(scene, camera);
}

['dragover', 'dragenter'].forEach(ev => document.getElementById('leftPane').addEventListener(ev, e => {
  e.preventDefault();
  if (currentState === 'EMPTY' || (currentState === 'RECORD_SAVED' && !savedRecord)) dropZone.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => document.getElementById('leftPane').addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
}));
document.getElementById('leftPane').addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (savedRecord) { toast('当前已存在动作记录，请先删除记录后再导入新视频', 'warn'); return; }
  if (currentState !== 'EMPTY') return;
  pendingImportMode = 'normal';
  handleVideoFile(f);
});
dropZone.addEventListener('click', e => {
  if (e.target.id === 'btnLoadRecord') return;
  if (savedRecord) { toast('请先删除当前记录，才能导入新视频', 'warn'); return; }
  if (currentState === 'EMPTY') { pendingImportMode = 'normal'; fileInput.click(); }
});
$('btnLoadRecord').addEventListener('click', e => {
  e.stopPropagation();
  if (savedRecord) { toast('当前已存在动作记录，请先删除记录', 'warn'); return; }
  $('recordFileInput').click();
});
$('recordFileInput').addEventListener('change', e => {
  loadRecordFile(e.target.files[0]); e.target.value = '';
});

// 播放 / 暂停·停止
$('btnPlay').addEventListener('click', () => {
  if (currentState === 'VIDEO_LOADED') startPlayback();
  else if (currentState === 'RECORDING') stopRecording();
});
$('btnDeleteVideo').addEventListener('click', deleteVideo);
$('btnCancelCorrect').addEventListener('click', cancelCorrection);

// 记录管理
$('btnDeleteRecord').addEventListener('click', deleteRecord);
$('btnDeleteRecord2').addEventListener('click', deleteRecord);
$('btnExportRecord').addEventListener('click', exportRecord);
$('btnCorrection').addEventListener('click', enterCorrectionMode);
$('btnCorrection2').addEventListener('click', enterCorrectionMode);

// 回放控制
$('btnReplay').addEventListener('click', () => startReplay(true));
$('btnReplayPlay').addEventListener('click', () => {
  if (!savedRecord) return;
  if (replay.time >= savedRecord.duration_seconds) replay.time = 0;
  replay.playing = !replay.playing;
  $('btnReplayPlay').textContent = replay.playing ? '暂停' : '播放';
});
$('replayProgress').addEventListener('input', e => {
  if (!savedRecord) return;
  replay.time = e.target.value / 1000 * savedRecord.duration_seconds;
  syncReplayUI();
});
document.querySelectorAll('.speedBtn').forEach(b => b.addEventListener('click', () => {
  replay.speed = parseFloat(b.dataset.speed);
  document.querySelectorAll('.speedBtn').forEach(x => x.classList.toggle('active', x === b));
}));

// 性别切换
$('btnMale').addEventListener('click', () => setModelGender('male'));
$('btnFemale').addEventListener('click', () => setModelGender('female'));

// 自定义模特 / 返回原始模特
function enterCustom() {
  subState = 'CUSTOM';
  customParams = Object.assign({}, GENDER_DEFAULTS[currentGender]); // 初始复制当前性别默认基础值
  syncSliders();
  applyBodyParams(customParams);
  updateButtons();
}
function enterOriginal() {
  subState = 'ORIGINAL';
  applyBodyParams(GENDER_DEFAULTS[currentGender]);
  updateButtons();
}
$('btnCustom').addEventListener('click', () => { subState === 'CUSTOM' ? enterOriginal() : enterCustom(); });
$('btnCustom2').addEventListener('click', enterCustom);

// 面板折叠
$('bodyPanelHeader').addEventListener('click', () => {
  const p = $('bodyPanel');
  p.classList.toggle('collapsed');
  $('collapseIcon').textContent = p.classList.contains('collapsed') ? '▶' : '◀';
});

// 对称锁定
$('symLock').addEventListener('change', e => {
  isSymmetric = e.target.checked;
  if (isSymmetric) { // 开启时右侧立即同步左侧
    Object.keys(customParams).forEach(k => {
      if (k.endsWith('L')) customParams[k.slice(0, -1) + 'R'] = customParams[k];
    });
    syncSliders();
    applyBodyParams(customParams);
  }
  applySymmetryUI();
});
// 重置为默认（当前性别）
$('btnResetParams').addEventListener('click', () => {
  customParams = Object.assign({}, GENDER_DEFAULTS[currentGender]);
  syncSliders();
  applyBodyParams(customParams);
});
// 模特配置
$('btnSaveConfig').addEventListener('click', saveModelConfig);
$('btnLoadConfig').addEventListener('click', () => $('configFileInput').click());
$('configFileInput').addEventListener('change', e => {
  loadModelConfig(e.target.files[0]); e.target.value = '';
});

// 融合权重联动（两滑块之和强制为 1）
$('weightA').addEventListener('input', e => {
  $('weightB').value = (1 - parseFloat(e.target.value)).toFixed(2); updateWeightLabels();
});
$('weightB').addEventListener('input', e => {
  $('weightA').value = (1 - parseFloat(e.target.value)).toFixed(2); updateWeightLabels();
});

// 导出
$('btnExport').addEventListener('click', export720PVideo);

/* ================================================================
   18. 启动
================================================================ */
function boot() {
  initPose();
  buildModelHierarchy();
  buildSliders();
  applyBodyParams(GENDER_DEFAULTS[currentGender]);
  setTPoseTargets();
  model.root.position.set(0, curLegHeight, 0);
  resizeToContainer();
  showLeftPanel('empty');
  setStatus('正在加载检测引擎…');
  updateButtons();
  renderLoop();
}
boot();
</script>
</body>
</html>
